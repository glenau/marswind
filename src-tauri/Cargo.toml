[package]
name = "marswind"
version = "0.1.1"
description = "Offline live subtitles and translation for system audio"
authors = ["Gleb Naumov"]
license = "MIT"
repository = "https://github.com/glenau/marswind"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marswind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rtrb = "0.3"
rubato = "0.16"
hound = "3.5"
log = "0.4"
env_logger = "0.11"
whisper-rs = { version = "0.16.0", default-features = false, features = ["metal"] }
sha2 = "0.11.0"
crossbeam-channel = "0.5.16"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util"] }
self_cell = "1.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString", "CFNumber"] }
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2.189"
